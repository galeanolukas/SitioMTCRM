[uwsgi]
socket = 127.0.0.1:3536
chdir = /home/ubuntu/SitioMTCRM/
wsgi-file = config/wsgi.py
processes = 4
threads = 2
stats = 127.0.0.1:9397
daemonize = /home/ubuntu/SitioMTCRM/log/uwsgi.log
pidfile = /home/ubuntu/SitioMTCRM/uwsgi.pid
plugin = python3
home = /home/ubuntu/DJENV/

; Serve static and media directly via uWSGI in production
static-map = /static=/home/ubuntu/SitioMTCRM/staticfiles
static-map = /media=/home/ubuntu/SitioMTCRM/media

; Optional: offload static serving to dedicated threads
offload-threads = 2
vacuum = true
