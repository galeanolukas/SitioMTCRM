{% extends 'base/layout.html' %}
{% load currency_filters %}

{% block content %}
<div class="card card-primary">
  <div class="card-header">
    <h3 class="card-title"><i class="fas fa-tags"></i> {{ title }}</h3>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-md-8">
        <table class="table table-sm">
          <thead>
            <tr><th>Nombre</th><th>Precio</th><th>Duración</th><th>Activo</th><th style="width: 15%;">Acciones</th></tr>
          </thead>
          <tbody>
            {% for plan in plans %}
            <tr>
              <form method="post">
                {% csrf_token %}
                <input type="hidden" name="action" value="update">
                <input type="hidden" name="plan_id" value="{{ plan.id }}">
                <td><input type="text" name="name" value="{{ plan.name }}" class="form-control form-control-sm" required></td>
                <td><input type="number" name="price" value="{{ plan.price }}" class="form-control form-control-sm" min="0" step="0.01" required></td>
                <td><input type="number" name="duration_days" value="{{ plan.duration_days }}" class="form-control form-control-sm" min="1" required></td>
                <td>
                  <input type="checkbox" name="is_active" class="form-check-input" {% if plan.is_active %}checked{% endif %}>
                </td>
                <td>
                  <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-save"></i></button>
                </td>
              </form>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
      <div class="col-md-4">
        <div class="card card-success">
          <div class="card-header"><h5 class="card-title mb-0">Nuevo plan</h5></div>
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              <input type="hidden" name="action" value="create">
              <div class="form-group mb-2">
                <label>Nombre</label>
                <input type="text" name="name" class="form-control" required>
              </div>
              <div class="form-group mb-2">
                <label>Precio</label>
                <input type="number" name="price" class="form-control" min="0" step="0.01" required>
              </div>
              <div class="form-group mb-2">
                <label>Duración (días)</label>
                <input type="number" name="duration_days" class="form-control" min="1" value="30" required>
              </div>
              <input type="hidden" name="is_active" value="on">
              <button type="submit" class="btn btn-success btn-block">
                <i class="fas fa-plus"></i> Crear plan
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card-footer">
    <a href="{% url 'subscriptions:list' %}" class="btn btn-secondary btn-flat">
      <i class="fas fa-arrow-left"></i> Volver al listado
    </a>
  </div>
</div>
{% endblock %}
