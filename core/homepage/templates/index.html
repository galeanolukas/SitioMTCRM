{% extends 'home.html' %}
{% load static %}
{% block body %}
<style>
  .home-page {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-box {
    width: 100%;
    max-width: 400px;
    padding: 20px;
  }
  .home-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }
  .home-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 40px 20px;
    text-align: center;
  }
  .home-header h1 {
    color: white;
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
  }
  .home-body {
    padding: 40px 30px;
  }
  .home-logo {
    width: 100px;
    height: 100px;
    margin-bottom: 25px;
    border-radius: 50%;
    background: white;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-weight: 600;
    font-size: 1.1rem;
    transition: all 0.3s ease;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
  }
  .tagline {
    color: #666;
    font-size: 1.1rem;
    margin-bottom: 30px;
  }
</style>
<body class="home-page">
  <div class="home-box">
    <div class="home-card">
      <div class="home-header">
        <h1>TechVentas</h1>
      </div>
      <div class="home-body text-center">
        <img src="{% static 'img/icon.png' %}" alt="Logo" class="home-logo"/>
        <p class="tagline">Gestión simple para tu negocio</p>
        <div class="d-grid">
          <a href="{% url 'login' %}" class="btn btn-primary">
            <i class="fas fa-sign-in-alt me-2"></i>Ingresar
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
{% endblock %}
