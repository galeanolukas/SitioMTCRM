{% load static %}
<div class="action-buttons">
  {% if view_url %}
  <a href="{{ view_url }}" class="btn btn-sm btn-info" title="Ver">
    <i class="fas fa-eye"></i>
  </a>
  {% endif %}
  
  {% if edit_url %}
  <a href="{{ edit_url }}" class="btn btn-sm btn-primary" title="Editar">
    <i class="fas fa-edit"></i>
  </a>
  {% endif %}
  
  {% if delete_url %}
  <a href="{{ delete_url }}" class="btn btn-sm btn-danger" 
     onclick="return confirm('¿Está seguro de eliminar este registro?');" 
     title="Eliminar">
    <i class="fas fa-trash"></i>
  </a>
  {% endif %}
  
  {% if custom_actions %}
    {% for action in custom_actions %}
    <a href="{{ action.url }}" class="btn btn-sm {{ action.btn_class|default:'btn-secondary' }}" 
       title="{{ action.title|default:action.label }}"
       {% if action.confirm %}onclick="return confirm('{{ action.confirm }}');"{% endif %}>
      <i class="fas fa-{{ action.icon }}"></i>
    </a>
    {% endfor %}
  {% endif %}
</div>
