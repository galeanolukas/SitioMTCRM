{% load static %}
<div class="card mb-3">
  <div class="card-header">
    <h5 class="card-title mb-0">
      <i class="fas fa-filter me-2"></i>Filtros
    </h5>
    <button type="button" class="btn btn-sm btn-secondary float-right" onclick="clear_filters()">
      <i class="fas fa-times me-1"></i>Limpiar
    </button>
  </div>
  <div class="card-body">
    <form method="get" class="filter-form">
      <div class="row">
        {% for field in filter_fields %}
        <div class="col-md-{{ field.col_size|default:4 }} mb-3">
          <label for="{{ field.name }}" class="form-label">{{ field.label }}</label>
          
          {% if field.type == 'text' %}
          <input type="text" name="{{ field.name }}" id="{{ field.name }}" 
                 class="form-control" value="{{ request.GET.field.name|default:'' }}"
                 placeholder="{{ field.placeholder|default:'' }}">
          
          {% elif field.type == 'select' %}
          <select name="{{ field.name }}" id="{{ field.name }}" class="form-select">
            <option value="">Todos</option>
            {% for choice in field.choices %}
            <option value="{{ choice.0 }}" {% if request.GET.field.name == choice.0 %}selected{% endif %}>
              {{ choice.1 }}
            </option>
            {% endfor %}
          </select>
          
          {% elif field.type == 'date' %}
          <input type="date" name="{{ field.name }}" id="{{ field.name }}" 
                 class="form-control" value="{{ request.GET.field.name|default:'' }}">
          
          {% elif field.type == 'date_range' %}
          <div class="input-group">
            <input type="date" name="{{ field.name }}_start" id="{{ field.name }}_start" 
                   class="form-control" value="{{ request.GET.field.name_start|default:'' }}"
                   placeholder="Desde">
            <span class="input-group-text">-</span>
            <input type="date" name="{{ field.name }}_end" id="{{ field.name }}_end" 
                   class="form-control" value="{{ request.GET.field.name_end|default:'' }}"
                   placeholder="Hasta">
          </div>
          
          {% elif field.type == 'checkbox' %}
          <div class="form-check">
            <input type="checkbox" name="{{ field.name }}" id="{{ field.name }}" 
                   class="form-check-input" {% if request.GET.field.name %}checked{% endif %}>
            <label class="form-check-label" for="{{ field.name }}">
              {{ field.checkbox_label|default:field.label }}
            </label>
          </div>
          {% endif %}
        </div>
        {% endfor %}
      </div>
      
      <div class="row">
        <div class="col-12">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-search me-2"></i>Buscar
          </button>
          <a href="{{ request.path }}" class="btn btn-secondary">
            <i class="fas fa-times me-2"></i>Limpiar
          </a>
        </div>
      </div>
    </form>
  </div>
</div>
