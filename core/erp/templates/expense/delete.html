{% extends 'vtc/body.html' %}
{% block content %}
<div class="content p-3">
  <div class="container-fluid">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <h3 class="card-title mb-0"><i class="fas fa-exclamation-triangle mr-1"></i> Confirmar eliminación</h3>
      </div>
      <div class="card-body">
        <p>¿Eliminar el gasto <strong>{{ object }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="fas fa-trash mr-1"></i> Eliminar
          </button>
          <a href="{% url 'erp:expense_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
