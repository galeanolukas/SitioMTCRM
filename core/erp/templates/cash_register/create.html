{% extends 'base/layout.html' %}
{% load static %}

{% block content %}
<div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
        <div class="card card-primary card-outline">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-cash-register"></i> Apertura de Caja</h3>
            </div>
            <form method="post" action="." id="cash-register-form">
                {% csrf_token %}
                <input type="hidden" name="action" value="{{ action }}">
                <div class="card-body">
                    <div id="error-block" class="alert alert-danger" style="display:none;"></div>
                    <div id="success-block" class="alert alert-success" style="display:none;"></div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="info-box bg-light">
                                <div class="info-box-content">
                                    <span class="info-box-text text-muted">Fecha</span>
                                    <span class="info-box-number" id="today-date"></span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="info-box bg-light">
                                <div class="info-box-content">
                                    <span class="info-box-text text-muted">Usuario</span>
                                    <span class="info-box-number">{{ request.user.get_full_name|default:request.user.username }}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="id_opening_balance"><i class="fas fa-wallet"></i> Saldo Inicial</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number" name="opening_balance" step="0.01" class="form-control" id="id_opening_balance" placeholder="0.00" value="0.00" required>
                        </div>
                        <small class="form-text text-muted">Ingrese el monto con el que abre la caja</small>
                    </div>

                    <div class="form-group">
                        <label for="id_notes"><i class="fas fa-sticky-note"></i> Notas</label>
                        <textarea name="notes" class="form-control" id="id_notes" rows="3" placeholder="Observaciones opcionales..."></textarea>
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-primary btn-flat">
                        <i class="fas fa-check"></i> Abrir Caja
                    </button>
                    <a href="{{ list_url }}" class="btn btn-default btn-flat">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
$(function() {
    // Mostrar fecha actual
    var today = new Date();
    var dateStr = today.toLocaleDateString('es-AR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
    $('#today-date').text(dateStr);

    // Enviar formulario via AJAX
    $('#cash-register-form').on('submit', function(e) {
        e.preventDefault();
        var parameters = new FormData(this);
        submit_with_ajax(window.location.pathname, 'Alerta!', '¿Está seguro de abrir la caja?', parameters, function() {
            location.href = '{{ list_url }}';
        });
    });
});
</script>
{% endblock %}
