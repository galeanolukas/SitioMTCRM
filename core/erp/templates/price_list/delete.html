{% extends 'base/form.html' %}
{% block content %}
<div class="card card-danger">
  <div class="card-header">
    <h3 class="card-title">
      <i class="fas fa-exclamation-triangle"></i>
      Eliminar Lista de Precios
    </h3>
  </div>
  <div class="card-body">
    <p>¿Estás seguro de que querés eliminar la lista <strong>{{ object.name }}</strong> ({{ object.discount_percentage }}%)?</p>
    <p class="text-muted">Los clientes que usen esta lista volverán al precio normal.</p>
    <form method="post">
      {% csrf_token %}
      <a href="{% url 'erp:pricelist_list' %}" class="btn btn-secondary btn-flat">
        <i class="fas fa-times"></i> Cancelar
      </a>
      <button type="submit" class="btn btn-danger btn-flat">
        <i class="fas fa-trash"></i> Sí, eliminar
      </button>
    </form>
  </div>
</div>
{% endblock %}
