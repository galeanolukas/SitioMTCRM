{% extends 'vtc/body.html' %}
{% block content %}
<div class="content-wrapper">
  <section class="content">
    <div class="container-fluid">
      <div class="card card-outline card-danger">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-exclamation-triangle me-2"></i> Eliminar Lista de Precios</h3>
        </div>
        <div class="card-body">
          <p>¿Estás seguro de que querés eliminar la lista <strong>{{ object.name }}</strong> ({{ object.discount_percentage }}%)?</p>
          <p class="text-muted">Los clientes que usen esta lista volverán al precio normal.</p>
          <form method="post">
            {% csrf_token %}
            <a href="{% url 'erp:pricelist_list' %}" class="btn btn-outline-secondary">
              <i class="fas fa-times me-1"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-danger">
              <i class="fas fa-trash me-1"></i> Sí, eliminar
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
