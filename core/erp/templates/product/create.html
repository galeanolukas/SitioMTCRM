{% extends 'base/form.html' %}

{% load static %}
{% block head_form %}
  <!-- head_form -->
  <link href="{% static 'lib/select2-4.0.13/css/select2.min.css' %}" rel="stylesheet" />
  <link href="{% static 'lib/select2-4.0.13/css/select2-bootstrap-5-theme.min.css' %}" rel="stylesheet" />
  <script src="{% static 'lib/select2-4.0.13/js/select2.min.js' %}"></script>
  <script src="{% static 'lib/select2-4.0.13/js/i18n/es.js' %}"></script>
  <!-- Agregar QuaggaJS para el escaneo de códigos de barras -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    .scanner-container {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    #scanner-button {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: #f8f9fa;
      border: 1px solid #ced4da;
      border-radius: 0 4px 4px 0;
      padding: 5px 10px;
      cursor: pointer;
    }
    #scanner-button:hover {
      background: #e9ecef;
    }
    #scanner-preview {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #scanner-video {
      max-width: 100%;
      max-height: 80vh;
    }
    #scanner-controls {
      margin-top: 15px;
    }
  </style>
{% endblock %}

{% block content %}
  <form method="post" action="." enctype="multipart/form-data">
    <div class="card card-default">
      <div class="card-header">
        <h3 class="card-title">
          {% if action == 'add' %}
            <i class="fas fa-plus"></i>
          {% else %}
            <i class="fas fa-edit"></i>
          {% endif %}

          {{ title }}
        </h3>
      </div>
      <div class="card-body">
        {% csrf_token %}

        <input type="hidden" name="action" value="{{ action }}" />

        <div id="error-block"></div>
        <div id="success-block"></div>

        {% include 'product/form_fields.html' %}
      </div>
      <div class="card-footer">
        <button type="submit" class="btn btn-primary btn-flat"><i class="fas fa-save"></i> Guardar registro</button>

        <a href="{{ list_url }}" class="btn btn-danger btn-flat"><i class="fas fa-times"></i> Cancelar</a>
      </div>
    </div>
  </form>
  <script>
    $('form').on('submit', function (e) {
      e.preventDefault()
      //var parameters = $(this).serializeArray();
      var parameters = new FormData(this)
      submit_with_ajax(window.location.pathname, 'Alerta!', '¿Estas seguro de realizar la siguiente acción?', parameters, function () {
        location.href = '{{ list_url }}'
      })
    })
  </script>
{% endblock %}

{% block javascript %}
  <script type="text/javascript">
    $(function () {
      // Inicializar select2
      $('.select2').select2({
        theme: 'bootstrap-5',
        language: 'es'
      });

      // Calcular automáticamente pvp_final cuando cambia pvp o iva_rate
      function calcularPrecioFinal() {
        const pvp = parseFloat($('#id_pvp').val()) || 0;
        const ivaRate = parseFloat($('#id_iva_rate').val()) || 0;
        const pvpFinal = $('#id_pvp_final').val();
        
        // Solo calcular si pvp_final está vacío o es 0
        if (!pvpFinal || parseFloat(pvpFinal) === 0) {
          // Normalizar iva_rate: si es mayor que 1, tratarlo como porcentaje (21 -> 0.21)
          let rate = ivaRate;
          if (rate > 1) {
            rate = rate / 100;
          }
          
          let precioFinal = pvp * (1 + rate);
          
          // Redondear hacia arriba al siguiente entero
          precioFinal = Math.ceil(precioFinal);
          
          $('#id_pvp_final').val(precioFinal.toFixed(2));
        }
      }
      
      // Calcular automáticamente pvp cuando cambia cost_price o margin_percentage
      function calcularPVPDesdeCosto() {
        const costPrice = parseFloat($('#id_cost_price').val()) || 0;
        const marginPercentage = parseFloat($('#id_margin_percentage').val()) || 0;
        
        // Solo calcular si hay valores válidos
        if (costPrice > 0 && marginPercentage >= 0) {
          // Calcular PVP basado en costo y margen: PVP = Costo / (1 - Margen)
          const marginRate = marginPercentage / 100;
          let calculatedPVP = costPrice / (1 - marginRate);
          
          // Redondear hacia arriba al siguiente entero
          calculatedPVP = Math.ceil(calculatedPVP);
          
          $('#id_pvp').val(calculatedPVP.toFixed(2));
          
          // Después de calcular PVP, calcular automáticamente el precio final
          calcularPrecioFinal();
        }
      }
      
            
      // Event listeners para cálculo automático
      $('#id_pvp, #id_iva_rate').on('input change', function() {
        calcularPrecioFinal();
      });
      
      // Event listener principal: margen dispara el cálculo de PVP
      $('#id_margin_percentage').on('input change', function() {
        calcularPVPDesdeCosto();
      });
      
      // Event listener secundario: costo también dispara el cálculo
      $('#id_cost_price').on('input change', function() {
        calcularPVPDesdeCosto();
      });
      
      // Si el usuario modifica pvp_final manualmente, no volver a calcular automáticamente
      $('#id_pvp_final').on('input', function() {
        $(this).data('manual-modified', true);
      });
      
      // Modificar la función de cálculo para respetar la modificación manual
      function calcularPrecioFinal() {
        const pvp = parseFloat($('#id_pvp').val()) || 0;
        const ivaRate = parseFloat($('#id_iva_rate').val()) || 0;
        const pvpFinalField = $('#id_pvp_final');
        
        // Solo calcular si no ha sido modificado manualmente o está vacío/0
        if (!pvpFinalField.data('manual-modified') || !pvpFinalField.val() || parseFloat(pvpFinalField.val()) === 0) {
          // Normalizar iva_rate: si es mayor que 1, tratarlo como porcentaje (21 -> 0.21)
          let rate = ivaRate;
          if (rate > 1) {
            rate = rate / 100;
          }
          
          const precioFinal = (pvp * (1 + rate)).toFixed(2);
          pvpFinalField.val(precioFinal);
        }
      }
      
      // Calcular al cargar la página si pvp_final está vacío
      calcularPrecioFinal();
      
      // Calcular PVP desde costo si hay valores
      calcularPVPDesdeCosto();

      // Agregar botón de escáner al campo de código
      const codeField = $('#id_code').parent();
      if (codeField.length) {
        codeField.addClass('scanner-container');
        $('#id_code').css('padding-right', '50px');
        codeField.append('<button type="button" id="scanner-button" title="Escanear código de barras"><i class="fas fa-barcode"></i></button>');
      }

      // Configurar el escáner
      let scannerActive = false;
      const scannerButton = $('#scanner-button');
      const scannerPreview = $('<div id="scanner-preview"><video id="scanner-video"></video><div id="scanner-controls"><button type="button" class="btn btn-danger" id="cancel-scan">Cancelar</button></div></div>');
      $('body').append(scannerPreview);

      // Manejar clic en el botón de escáner
      scannerButton.on('click', function() {
        if (!scannerActive) {
          startScanner();
        }
      });

      // Manejar clic en cancelar escaneo
      $(document).on('click', '#cancel-scan', function() {
        stopScanner();
      });

      // Detener el escáner al hacer clic fuera del área de vista previa
      scannerPreview.on('click', function(e) {
        if (e.target === this) {
          stopScanner();
        }
      });

      // Función para iniciar el escáner
      function startScanner() {
        scannerActive = true;
        scannerPreview.fadeIn();
        
        Quagga.init({
          inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#scanner-video'),
            constraints: {
              width: 480,
              height: 320,
              facingMode: "environment" // Usar la cámara trasera si está disponible
            },
          },
          decoder: {
            readers: [
              'code_128_reader',
              'ean_reader',
              'ean_8_reader',
              'code_39_reader',
              'code_39_vin_reader',
              'codabar_reader',
              'upc_reader',
              'upc_e_reader',
              'i2of5_reader'
            ]
          }
        }, function(err) {
          if (err) {
            console.error(err);
            alert('Error al iniciar el escáner: ' + err);
            stopScanner();
            return;
          }
          Quagga.start();
        });

        // Manejar el resultado del escaneo
        Quagga.onDetected(function(result) {
          const code = result.codeResult.code;
          $('#id_code').val(code).trigger('change');
          stopScanner();
        });
      }

      // Función para detener el escáner
      function stopScanner() {
        if (scannerActive) {
          Quagga.stop();
          scannerPreview.fadeOut();
          scannerActive = false;
        }
      }

      // Detener el escáner al salir de la página
      $(window).on('beforeunload', function() {
        if (scannerActive) {
          Quagga.stop();
        }
      });
    });
  </script>
{% endblock %}
