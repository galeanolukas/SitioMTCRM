[uwsgi]
; Usar socket Unix (más rápido que TCP para lighttpd)
socket = /tmp/uwsgi_sitio_mtcrm.sock
chmod-socket = 666
chdir = /home/ubuntu/www/SitioMTCRM/
wsgi-file = config/wsgi.py

; Procesos y threads ajustados para servidor ligero
; Ajustar según CPU: procesos = cores, threads = 2-4
processes = 4
threads = 4

; Stats para monitoreo
stats = 127.0.0.1:9495

; Logging mejorado
daemonize = /home/ubuntu/www/SitioMTCRM/log/uwsgi.log
pidfile = /home/ubuntu/www/SitioMTCRM/uwsgi.pid
log-maxsize = 10485760  ; 10MB max por archivo
log-backupname = uwsgi.log.old

; Entorno Python
plugin = python3
home = /home/ubuntu/DJENV/
pythonpath = /home/ubuntu/www/SitioMTCRM

; Optimizaciones de rendimiento
master = true
vacuum = true
max-requests = 5000  ; Reciclar workers cada 5000 requests
harakiri = 30  ; Timeout de 30 segundos
reload-on-rss = 256  ; Recargar si usa >256MB RAM
buffer-size = 32768  ; 32KB buffer

; NO servir estáticos via uWSGI (lighttpd lo hace mejor)
; Comentar static-map para que lighttpd maneje archivos estáticos
; static-map = /static=/home/ubuntu/www/SitioMTCRM/staticfiles
; static-map = /media=/home/ubuntu/www/SitioMTCRM/media

; Offload threads para I/O pesado
offload-threads = 4

; Lazy apps para ahorrar memoria al inicio
lazy-apps = true

; Enable cheaper mode para ahorrar recursos cuando hay poco tráfico
cheaper = 2
cheaper-initial = 2
